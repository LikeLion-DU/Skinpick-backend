# Railway·Render 는 컨테이너에 PORT 를 주입하고 그 포트로만 트래픽을 보낸다.
# 8080 에 고정해 두면 배포는 성공하는데 헬스체크가 끝까지 안 붙는다.
server.port: ${PORT:8080}

spring:
  application.name: skinplate-api
  # 배포 시 SPRING_PROFILES_ACTIVE=prod 를 반드시 넘긴다.
  # 안 넘기면 테스트 계정 3개와 /auth/test-login 이 열린 채로 뜬다.
  profiles.active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # Supabase 는 sslmode 를 URL 에 실어야 해서 전체 URL 을 덮어쓸 구멍을 둔다.
    # DB_JDBC_URL 을 안 주면 아래 조합이 그대로 로컬 Docker 를 가리킨다.
    url: ${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skinplate}}
    username: ${DB_USER:skinplate}
    password: ${DB_PASSWORD:skinplate}

  jpa:
    hibernate.ddl-auto: validate        # 스키마는 Flyway가 소유한다
    open-in-view: false
    properties:
      hibernate.format_sql: true
      hibernate.default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    # ★ 0 이어야 한다. 기본값 1 이면 public 스키마에 객체가 하나라도 있는 DB —
    #   Supabase 는 SQL 에디터를 한 번만 써도 그렇게 된다 — 에서 V1 을 "이미 적용됨"으로
    #   기록하고 건너뛴 뒤 V2 가 `relation "skin_analysis" does not exist` 로 죽는다.
    #   0 으로 두면 baseline 은 0 에 찍히고 V1 부터 정상 적용된다.
    baseline-version: 0

  servlet.multipart:
    max-file-size: 5MB
    # 피부 분석이 5MB 짜리 세 장을 한 요청에 싣는다. 10MB 로 두면 게이트가 없는 웹에서
    # 원본 세 장이 그대로 올라와 413 이 나고, 앱에는 "분석 실패"만 뜬다.
    max-request-size: 20MB

  jackson:
    default-property-inclusion: non_null
    serialization.write-dates-as-timestamps: false

app:
  auth:
    jwt:
      secret: ${JWT_SECRET}                        # 32바이트 이상
      validity-seconds: 604800                     # 7일
    analysis-token:
      validity-seconds: 1800                     # 30분
    test-account:
      enabled: ${TEST_ACCOUNT_ENABLED:true}
      password: ${TEST_ACCOUNT_PASSWORD:test1234!}
  ai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    # gpt-5 계열은 요청 규약이 다르다(OpenAiVisionClient 가 모델 이름으로 가른다).
    # gpt-4o 로 되돌리려면 OPENAI_MODEL 한 줄이면 된다 — temperature 0.2 도 같이 돌아온다.
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    timeout-seconds: 25            # 음식·문장 생성용. 재시도 없는 단발.
                                   # 클라이언트 타임아웃(32초)보다 반드시 짧아야 한다
    # 피부만 따로 둔다. 출력이 5지표 + 8축 + 근거라 다른 호출의 두 배 가까이 나오고,
    # 상한을 다 같이 올리면 음식 호출의 출력 폭주 방어까지 헐거워진다.
    # 1400 은 상한이지 목표가 아니다 — 실제 출력은 600~900 토큰을 노린다.
    skin-max-tokens: ${SKIN_MAX_TOKENS:1400}
    # 30 이 아니라 28 이다. 429 가 한 번 끼면 최악이 0.1 + 2 + 이 값이라,
    # 30 이면 32.1 초로 클라이언트 상한(32초)을 넘겨 AI_TIMEOUT 분기가 도달 불가가 된다.
    # 실측 지연이 3.5초라 2초를 깎아도 잃는 게 없다.
    skin-timeout-seconds: ${SKIN_TIMEOUT_SECONDS:28}
    mock: ${AI_MOCK:false}

springdoc:
  swagger-ui.path: /swagger-ui/index.html

logging.level:
  com.skinplate.api: DEBUG
